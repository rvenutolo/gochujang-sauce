name: merge-gate

# Always-green required status check. It exists so the protect-main ruleset's
# "require branches to be up to date before merging" (strict status checks)
# has a check to attach to on repos with no real CI.
# Managed alongside rvenutolo/tofu-github-repos.

on:
  pull_request:

permissions: {}

jobs:
  merge-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: gate
        run: "true"
